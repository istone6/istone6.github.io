    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-color: #fafafa;
            --container-bg: rgba(255, 255, 255, 0.72);
            --container-border: rgba(255, 255, 255, 0.8);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --search-bg: rgba(255, 255, 255, 0.8);
            --search-border: rgba(210, 215, 220, 0.5);
            --translate-btn-bg: rgba(245, 247, 250, 0.8);
            --translate-btn-border: rgba(200, 205, 215, 0.4);
            --card-bg: rgba(255, 255, 255, 0.68);
            --card-border: rgba(225, 230, 235, 0.4);
            --card-hover-bg: rgba(255, 255, 255, 0.88);
            --card-hover-border: rgba(0, 122, 255, 0.25);
            --modal-bg: rgba(255, 255, 255, 0.96);
            --modal-border: rgba(250, 250, 252, 0.6);
            --input-bg: rgba(248, 250, 252, 0.8);
            --input-border: rgba(190, 195, 205, 0.45);
            --footer-border: rgba(195, 200, 210, 0.3);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(0, 122, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(88, 86, 214, 0.03) 0%, transparent 50%);
            min-height: 100vh;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow-x: hidden;
        }
        /* sus.market 风格背景 - 等距等大小的浅灰色方形色块 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(220, 220, 220, 0.35) 1px, transparent 1px),
                linear-gradient(90deg, rgba(220, 220, 220, 0.35) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }
        /* 装饰性渐变光晕 */
        body::after {
            content: '';
            position: fixed;
            top: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 122, 255, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 1580px;
            width: 100%;
            background: var(--container-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 40px;
            padding: 32px 30px 28px;
            box-shadow: 
                0 32px 80px rgba(0, 0, 0, 0.06),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            border: 1px solid var(--container-border);
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        h1 {
            font-weight: 600;
            letter-spacing: -0.02em;
            font-size: 28px;
            color: var(--text-primary);
            opacity: 0.92;
        }
        .header-actions { display: flex; gap: 12px; align-items: center; }
        .add-btn {
            width: 50px; height: 50px; border-radius: 50%;
            background: linear-gradient(135deg, #34c759 0%, #30d158 100%);
            border: none; color: white; font-size: 28px; font-weight: 300;
            cursor: pointer; 
            box-shadow:

<body>
    <div class="container">
        <div class="header-row">
            <h1>🔖 我的导航</h1>
            <div class="header-actions">
                <button class="add-btn" onclick="openAddModal()" title="添加网站">＋</button>
                <button class="gear-btn" id="gearBtn" onclick="toggleEditMode()" title="编辑模式">⚙️</button>
            </div>
        </div>
        <div class="search-area">
            <div class="search-main">
                <select id="engineSelect">
                    <option value="baidu">百度</option>
                    <option value="google">Google</option>
                    <option value="bing">Bing</option>
                    <option value="github">GitHub</option>
                    <option value="youtube">YouTube</option>
                    <option value="taobao">淘宝</option>
                </select>
                <input type="text" id="searchInput" placeholder="搜索…" onkeydown="if(event.key==='Enter') doSearch()">
                <button onclick="doSearch()">搜索</button>
            </div>
            <div class="translate-btns" id="translateBtns"></div>
        </div>
        <div id="navContent"></div>
        <div class="data-management">
            <button class="data-btn" onclick="exportData()">📤 导出备份</button>
            <button class="data-btn" onclick="triggerImport()">📥 导入备份</button>
            <input type="file" id="importFileInput" accept=".json" onchange="importData(event)">
        </div>
        <div class="footer-note">
            点击 ⚙️ 进入编辑模式 · 拖拽分类或网站调整顺序 · 所有数据自动保存在本地
        </div>
    </div>
    <div class="modal-overlay" id="transModal">
        <div class="modal-box">
            <h2 id="transModalTitle">编辑翻译链接</h2>

            <div class="modal-field"><label>目标网址</label><input type="text" id="transUrlInput"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeTransModal()">取消</button>
                <button class="btn-confirm" onclick="saveTransUrl()">保存</button>
            </div>
        </div>
    </div>

        <div class="modal-box">
            <h2 id="siteModalTitle">添加网站</h2>

            <div class="modal-field"><label>网址</label><input type="text" id="siteUrlInput" placeholder="https://juejin.cn"></div>

                        <div class="emoji-grid" id="emojiGrid"></div>
                    </div>

            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeSiteModal()">取消</button>
                <button class="btn-confirm" onclick="saveSite()">保存</button>
            </div>
        </div>

    <script>

        }
        function openCatModal(ci){
            editingCatIndex=ci;document.getElementById('catModalTitle').textContent='编辑分类';
            document.getElementById('catNameInput').value=navData[ci].category;document.getElementById('catIconInput').value=navData[ci].icon;
            document.getElementById('catModal').classList.add('active');
        }
        function closeCatModal(){document.getElementById('catModal').classList.remove('active');document.getElementById('catEmojiPicker').classList.remove('active');}
        function saveCat(){
            const name=document.getElementById('catNameInput').value.trim(),icon=document.getElementById('catIconInput').value.trim()||'📁';
            if(!name){alert('请填写分类名称');return;}
            navData[editingCatIndex].category=name;navData[editingCatIndex].icon=icon;saveData();closeCatModal();render();
        }
        function openTransModal(id){
            editingTransId=id;const t=transData.find(x=>x.id===id);
            document.getElementById('transNameInput').value=t.name;document.getElementById('transUrlInput').value=t.url;
            document.getElementById('transModal').classList.add('active');
        }
        function closeTransModal(){document.getElementById('transModal').classList.remove('active');}
        function saveTransUrl(){
            const t=transData.find(x=>x.id===editingTransId);
            t.name=document.getElementById('transNameInput').value.trim();t.url=document.getElementById('transUrlInput').value.trim();
            saveData();closeTransModal();render();
        }
        function confirmDeleteCat(ci){
            document.getElementById('confirmTitle').textContent='删除分类';
            document.getElementById('confirmMessage').textContent=`确定要删除「${navData[ci].category}」分类及其下所有网站吗？此操作不可撤销。`;
            confirmCallback=()=>{navData.splice(ci,1);saveData();render();};
            document.getElementById('confirmModal').classList.add('active');
        }
        function confirmDeleteSite(ci,si){
            document.getElementById('confirmTitle').textContent='删除网站';
            document.getElementById('confirmMessage').textContent=`确定要删除「${navData[ci].items[si].name}」吗？`;
            confirmCallback=()=>{navData[ci].items.splice(si,1);saveData();render();};
            document.getElementById('confirmModal').classList.add('active');
        }
        function closeConfirmDialog(){document.getElementById('confirmModal').classList.remove('active');}
        document.getElementById('confirmOkBtn').onclick=()=>{confirmCallback&&confirmCallback();closeConfirmDialog();};
        function exportData(){
            const blob=new Blob([JSON.stringify({navData,transData},null,2)],{type:'application/json'});
            const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='我的导航备份.json';a.click();
        }
        function triggerImport(){document.getElementById('importFileInput').click();}
        function importData(e){
            const f=e.target.files[0];if(!f)return;
            const r=new FileReader();r.onload=ev=>{
                try{
                    const d=JSON.parse(ev.target.result);
                    if(d.navData&&Array.isArray(d.navData)){navData=d.navData;if(d.transData)transData=d.transData;saveData();render();alert('导入成功！');}
                    else alert('无效的备份文件');
                }catch{alert('导入失败，请检查文件格式');}
            };r.readAsText(f);e.target.value='';
        }
        function initEmojiPickers(){
            initEmojiPicker('emoji','siteIconInput');initEmojiPicker('catEmoji','catIconInput');
        }
        function initEmojiPicker(prefix,inputId){
            const tabs=document.getElementById(prefix+'Tabs'),grid=document.getElementById(prefix+'Grid');
            tabs.innerHTML=Object.keys(EMOJI_CATEGORIES).map(cat=>
                `<button class="emoji-tab ${(prefix==='emoji'?currentEmojiCategory:catEmojiCategory)===cat?'active':''}" onclick="selectEmojiCategory('${prefix}','${cat}')">${cat}</button>`
            ).join('');
            renderEmojiGrid(prefix,inputId);
        }
        function selectEmojiCategory(prefix,cat){
            if(prefix==='emoji')currentEmojiCategory=cat;else catEmojiCategory=cat;
            document.querySelectorAll('#'+prefix+'Tabs .emoji-tab').forEach(t=>t.classList.toggle('active',t.textContent===cat));
            renderEmojiGrid(prefix,prefix==='emoji'?'siteIconInput':'catIconInput');
        }
        function renderEmojiGrid(prefix,inputId){
            const cat=prefix==='emoji'?currentEmojiCategory:catEmojiCategory;
            document.getElementById(prefix+'Grid').innerHTML=EMOJI_CATEGORIES[cat].map(e=>
                `<div class="emoji-item" onclick="selectEmoji('${inputId}','${e}')">${e}</div>`
            ).join('');
        }
        function selectEmoji(inputId,emoji){document.getElementById(inputId).value=emoji;toggleEmojiPicker();toggleCatEmojiPicker();}
        function toggleEmojiPicker(){document.getElementById('emojiPicker').classList.toggle('active');}
        function toggleCatEmojiPicker(){document.getElementById('catEmojiPicker').classList.toggle('active');}
        document.addEventListener('click',e=>{
            if(!e.target.closest('.icon-input-wrapper')){
                document.getElementById('emojiPicker').classList.remove('active');
                document.getElementById('catEmojiPicker').classList.remove('active');
            }
        });
        loadData();render();
    </script>
</body>
</html>
